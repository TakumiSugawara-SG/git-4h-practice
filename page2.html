<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>カールじいさんのプロフィール</title>
    <style>
        body {
            background-color: #f7f9fa;
            color: #333333;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            color: #2c3e50;
            margin-bottom: 50px;
            letter-spacing: 1px;
        }

        .section-box {
            background: #ffffff;
            max-width: 500px;
            margin: 0 auto 30px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        h2 {
            margin-top: 0;
            color: #34495e;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        table {
            border-collapse: collapse;
            margin-top: 10px;
            width: 100%;
        }

        td {
            padding: 8px 12px;
        }

        .profile-label {
            text-align: right;
            width: 40%;
            color: #7f8c8d;
            font-weight: bold;
            vertical-align: top; /* 遍歴が複数行になっても綺麗に見せるため */
        }

        .profile-value {
            text-align: left;
            width: 60%;
        }

        a {
            display: inline-block;
            background-color: #3498db;
            color: white !important;
            text-decoration: none;
            padding: 8px 24px;
            border-radius: 20px;
            transition: 0.2s;
            margin-top: 15px;
        }

        a:hover {
            background-color: #2980b9;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
<h1>カールじいさんのプロフィール</h1>

<div align="center" class="section-box">
    <h2><font size="6">詳細プロフィール</font></h2>
    <table align="center" border="0">
        <tr>
            <td class="profile-label"><font size="4">生年月日：</font></td>
            <td class="profile-value"><font size="4"><strong>2024年11月2日</strong></font></td>
        </tr>
        <tr>
            <td class="profile-label"><font size="4">出身王国：</font></td>
            <td class="profile-value"><font size="4"><strong>2005</strong></font></td>
        </tr>
        <tr>
            <td class="profile-label"><font size="4">血液型：</font></td>
            <td class="profile-value"><font size="4"><strong>AB型</strong></font></td>
        </tr>
        <tr>
            <td class="profile-label"><font size="4">趣味：</font></td>
            <td class="profile-value"><font size="4"><strong>宝石集め、他国見学、情報集め</strong></font></td>
        </tr>
        <tr>
            <td class="profile-label"><font size="4">特技：</font></td>
            <td class="profile-value"><font size="4"><strong>仲介、熊狩り</strong></font></td>
        </tr>

        <!-- 阿部寛HPの経歴風：所属ギルドの遍歴（<br>で複数行にしています） -->
        <tr>
            <td class="profile-label"><font size="4">同盟遍歴：</font></td>
            <td class="profile-value">
                <font size="4">
                    <strong>・[ACE]ACE</strong><br>
                    <strong>・[VAC]plaisir <br>（第1回王城戦前～、当時同盟総力2位）</strong><br>
                    <strong>・[PKS]ポッケの里 <br>（～現在、盟主交代時にVACからPKSへ名称変更）</strong>
                </font>
            </td>
        </tr>

        <!-- 新設：一言欄 -->
        <tr>
            <td class="profile-label"><font size="4">ひとこと：</font></td>
            <td class="profile-value">
                <font size="4"><strong>継続は力なり</strong></font>
            </td>
        </tr>

        <tr>
            <td colspan="2" align="center">
                <br>
                <a href="./index.html"><strong>トップに戻る</strong></a>
            </td>
        </tr>
    </table>
</div>
</body>
</html>
